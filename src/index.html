<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>אתר למידה עצמית</title>
</head>
<body style="margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; color: #333;">

    <!-- כותרת האתר -->
    <header style="background-color: #2c3e50; color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
        <h1 style="margin: 0; font-size: 32px;">הפלטפורמה ללמידה עצמית</h1>
        <p style="margin: 10px 0 0 0; font-size: 18px; opacity: 0.9;">להתפתח וללמוד מכל מקום, בקצב שלך</p>
    </header>

    <!-- התוכן המרכזי -->
    <main style="padding: 50px 20px; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center;">
       
        <section style="text-align: center; margin-bottom: 40px; max-width: 600px;">
            <h2 style="color: #2c3e50; font-size: 28px;">הצטרפו לקהילת הלומדים שלנו</h2>
            <p style="font-size: 18px; line-height: 1.6; color: #555;">
                מבוא לתכנות, פיתוח אתרים, אלגוריתמיקה ועוד. הירשמו עכשיו וקבלו גישה למגוון קורסים וכלים שיעזרו לכם להצליח.
            </p>
        </section>

        <!-- אזור הטופס -->
        <section style="background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); width: 100%; max-width: 400px;">
            <h3 style="margin-top: 0; color: #4CAF50; text-align: center; margin-bottom: 25px; font-size: 24px;">הרשמה מהירה</h3>
           
            <!-- הטופס שלך מתחיל כאן -->
            <form id="signupForm">
                <div style="margin-bottom: 20px;">
                    <label for="name" style="display: block; margin-bottom: 8px; color: #444; font-weight: 500;">שם מלא</label>
                    <input type="text" id="name" required placeholder="ישראל ישראלי" style="box-sizing: border-box; width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s;">
                </div>
               
                <div style="margin-bottom: 20px;">
                    <label for="email" style="display: block; margin-bottom: 8px; color: #444; font-weight: 500;">כתובת דוא"ל</label>
                    <input type="email" id="email" required placeholder="your@email.com" style="box-sizing: border-box; width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s; direction: ltr; text-align: right;">
                </div>
               
                <div style="margin-bottom: 30px;">
                    <label for="password" style="display: block; margin-bottom: 8px; color: #444; font-weight: 500;">סיסמה</label>
                    <input type="password" id="password" required placeholder="••••••••" style="box-sizing: border-box; width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; transition: all 0.3s; direction: ltr; text-align: right;">
                </div>
               
                <button type="submit" style="width: 100%; padding: 15px; background-color: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);">
                    צור משתמש חדש
                </button>
            </form>
            <!-- הטופס שלך מסתיים כאן -->

        </section>
    </main>

    <!-- אזור תחתון (Footer) -->
    <footer style="text-align: center; padding: 20px; color: #888; font-size: 14px; margin-top: 20px;">
        <p>© 2026 כל הזכויות שמורות לפלטפורמת הלמידה העצמית.</p>
    </footer>

    <!-- חיבור קובץ ה-JavaScript (חייב להיות באותה תיקייה תחת השם script.js) -->
    <script src="script.js"></script>
</body>
</html>
